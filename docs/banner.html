<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width:1200px; height:336px; overflow:hidden;
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    background:#070b18; color:#fff; position:relative;
  }
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(600px 340px at 10% 0%, rgba(107,138,253,0.32), transparent 60%),
      radial-gradient(560px 340px at 95% 110%, rgba(76,111,255,0.26), transparent 60%),
      linear-gradient(160deg, #0a1024 0%, #070b18 55%, #0a0f22 100%);
  }
  .grid {
    position:absolute; inset:0; opacity:0.5;
    background-image:linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                     linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(700px 340px at 50% 45%, #000 30%, transparent 78%);
  }
  .content { position:relative; padding:36px 56px; height:100%; display:flex; flex-direction:column; }
  .cap {
    display:flex; align-items:center; gap:10px;
    font-size:16px; font-weight:600; letter-spacing:2.5px; color:#aebfff;
    margin-bottom:16px;
  }
  .cap i { width:8px; height:8px; border-radius:50%; background:#6b8afd; box-shadow:0 0 10px #6b8afd; }
  .shot {
    border-radius:18px; overflow:hidden; height:208px; flex:none;
    border:1px solid rgba(255,255,255,0.14);
    box-shadow:0 24px 70px rgba(0,0,0,0.55), 0 0 90px rgba(107,138,253,0.12);
  }
  .shot img { display:block; width:100%; height:100%; object-fit:fill; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="grid"></div>
  <div class="content">
    <div class="cap"><i></i>LIVE IN THE COMPOSER</div>
    <div class="shot"><img src="screenshot-composer.png" alt="Effort slider pill live in the DSH composer"></div>
  </div>
</body>
</html>
